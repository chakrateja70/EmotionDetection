<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 80px auto;
            text-align: center;
            background-color: #f4f6f8;
        }
        h1 {
            color: #2c3e50;
        }
        textarea {
            width: 90%;
            height: 100px;
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        button {
            margin-top: 15px;
            padding: 10px 25px;
            font-size: 16px;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1f6690;
        }
        #system_response {
            margin-top: 25px;
            font-size: 18px;
            color: #2c3e50;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Emotion Detector</h1>
    <p>Enter a statement below to analyze its emotional tone:</p>

    <textarea id="textToAnalyze" placeholder="Type your statement here..."></textarea>
    <br>
    <button onclick="RunSentimentAnalysis()">Analyze</button>

    <div id="system_response">{{ response or "" }}</div>

    <script>
        function RunSentimentAnalysis() {
            let text = document.getElementById("textToAnalyze").value;

            if (text.trim() === "") {
                document.getElementById("system_response").innerText = "Invalid input! Try again.";
                return;
            }

            let xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function() {
                if (this.readyState == 4) {
                    if (this.status == 200) {
                        document.getElementById("system_response").innerText = this.responseText;
                    } else {
                        document.getElementById("system_response").innerText = "Invalid input! Try again.";
                    }
                }
            };
            xhttp.open("GET", "/emotionDetector?textToAnalyze=" + encodeURIComponent(text), true);
            xhttp.setRequestHeader("X-Requested-With", "XMLHttpRequest");
            xhttp.send();
        }
    </script>
</body>
</html>
