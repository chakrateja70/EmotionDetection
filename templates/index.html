<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Emotion Detector</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      .container { max-width: 640px; margin: auto; }
      label, button { display: block; margin-top: 1rem; }
      textarea { width: 100%; height: 120px; }
      .response { margin-top: 1rem; padding: 1rem; border: 1px solid #ccc; }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Emotion Detector</h1>
      <form action="/emotionDetector" method="get">
        <label for="textToAnalyze">Enter text to analyze:</label>
        <textarea id="textToAnalyze" name="textToAnalyze"></textarea>
        <button type="submit">Analyze Emotion</button>
      </form>
      {% if response %}
      <div class="response">
        <strong>Result:</strong>
        <p>{{ response }}</p>
      </div>
      {% endif %}
    </div>
  </body>
</html>
